apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
# Evidence Pod: two containers, only `worker` logs the error.
apiVersion: v1
kind: Pod
metadata:
  name: bridge
  namespace: starfleet
  labels:
    app: bridge
spec:
  containers:
  - name: api
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - 'while true; do echo "api: request served"; sleep 5; done'
  - name: worker
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - 'echo "worker: started"; echo "worker: ERROR code=E-5290 backend unreachable" >&2; sleep 3600'
---
# Fault: the init container refuses to finish while MODE is not "ready".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      initContainers:
      - name: fetch-config
        image: docker.io/library/busybox:1.37.0
        env:
        - name: MODE
          value: draft
        command:
        - sh
        - -c
        - 'echo "fetch-config: mode=$MODE"; if [ "$MODE" != "ready" ]; then echo "fetch-config: ERROR mode must be ready" >&2; exit 1; fi; echo "fetch-config: ok"'
      containers:
      - name: main
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - 'echo "main: running"; sleep 3600'
