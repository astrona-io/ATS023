apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
# Pinned to the worker node so its log file is on a known node.
apiVersion: v1
kind: Pod
metadata:
  name: beacon-logger
  namespace: starfleet
spec:
  nodeSelector:
    kubernetes.io/hostname: astro-ats-023-playground-040-03-worker
  containers:
  - name: logger
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - 'echo "beacon: node log marker playground-77"; echo "beacon: second line on stderr" >&2; sleep 3600'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
      - name: scout
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - 'while true; do echo "scout heartbeat"; sleep 5; done'
---
# Fault on purpose: the image tag does not exist, so the kubelet logs pull errors.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      containers:
      - name: relay
        image: docker.io/library/busybox:1.37.99
        command:
        - sh
        - -c
        - 'sleep 3600'
