# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Repair Cluster DNS (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-023-lab-050-02-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/python:3.13-alpine
      - docker.io/library/busybox:1.37.0

# Starting state: the Starfleet workloads run, CoreDNS is scaled to zero and
# its Corefile names the zone cluster.locall. The faults stay on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads, then break cluster DNS
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: coredns-running
      description: CoreDNS runs two ready replicas
      type: file
      source: validation/validate-coredns-running.sh
      hint: The coredns Deployment in kube-system is scaled to zero. Scale it back to its original two replicas.
    - name: corefile-zone
      description: The Corefile serves the zone cluster.local
      type: file
      source: validation/validate-corefile-zone.sh
      hint: Read the Corefile in the coredns ConfigMap in kube-system. The kubernetes plugin line must name the zone cluster.local. Keep forward and errors.
    - name: service-lookups
      description: Service names resolve from starfleet and outpost
      type: file
      source: validation/validate-service-lookups.sh
      hint: From a pod, run nslookup for probe.starfleet.svc.cluster.local. Fix the first thing that fails.
    - name: dns-not-bypassed
      description: Pods still use the kube-dns Service and nothing was removed
      type: file
      source: validation/validate-dns-not-bypassed.sh
      hint: Do not change dnsPolicy, dnsConfig or the kube-dns Service. Repair CoreDNS itself.

teardown:
  keepCluster: false
