# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Troubleshoot Services And Networking Capstone (LAB). Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-023-capstone-050
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/python:3.13-alpine
      - docker.io/library/busybox:1.37.0

# Starting state: four faults across DNS, probes, Service selection and
# NetworkPolicy. They stay in place on purpose.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the workloads and the four faults
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: coredns-ready
      description: CoreDNS runs two ready replicas
      type: file
      source: validation/validate-coredns-ready.sh
      hint: Cluster DNS answers through pods of the coredns Deployment in kube-system.
    - name: probe-endpoints
      description: probe has two ready endpoints and keeps its readiness probe
      type: file
      source: validation/validate-probe-endpoints.sh
      hint: Pods that run but are not ready are not endpoints. Find out why the probe pods are not ready; do not remove the check.
    - name: scout-endpoints
      description: The scout Service has two ready endpoints
      type: file
      source: validation/validate-scout-endpoints.sh
      hint: Compare the Service selector with the labels of the pods.
    - name: dns-lookups
      description: Both Service names resolve from shuttle
      type: file
      source: validation/validate-dns-lookups.sh
      hint: Use nslookup with the fully qualified Service name from the shuttle pod.
    - name: shuttle-reaches-both
      description: shuttle receives answers from probe and scout
      type: file
      source: validation/validate-shuttle-reaches-both.sh
      hint: Test each stage in order, and test from the shuttle pod, not from your machine.
    - name: policy-allows-shuttle-only
      description: Only shuttle is allowed, on the pod port, and the deny policy remains
      type: file
      source: validation/validate-policy-allows-shuttle-only.sh
      hint: NetworkPolicy ports are pod ports. Keep the default deny and do not open ingress to every source.

teardown:
  keepCluster: false
