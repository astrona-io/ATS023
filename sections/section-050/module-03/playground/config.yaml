# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Endpoints, Probes And NetworkPolicy (PLAYGROUND). A clean sandbox: kind cluster with
# the Starfleet workloads and a second Service with a wrong targetPort. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-023-playground-050-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/python:3.13-alpine
      - docker.io/library/busybox:1.37.0

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
