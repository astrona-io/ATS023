# Pending Pods, Taints And Node Maintenance (PLAYGROUND). Ungraded environment.
apiVersion: astrona.io/v1
metadata:
  name: ats-023-playground-010-02
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    description: Label the worker and create workloads that run and workloads that stay Pending
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
