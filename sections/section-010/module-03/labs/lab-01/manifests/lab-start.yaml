apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-config
  namespace: starfleet
data:
  greeting: hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/busybox:1.37.99
        command: ["sh", "-c", "echo greeting=$GREETING; sleep 3600"]
        env:
        - name: GREETING
          valueFrom:
            configMapKeyRef:
              name: probe-settings
              key: greeting
